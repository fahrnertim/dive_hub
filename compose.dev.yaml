# Development database only. Start: docker compose -f compose.dev.yaml up -d
# Published on localhost only; never use these credentials outside development.
services:
  db:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: divehub
      POSTGRES_PASSWORD: divehub-dev
      POSTGRES_DB: divehub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Since PostgreSQL 18 the volume is mounted at /var/lib/postgresql (not .../data).
      - dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divehub -d divehub"]
      interval: 5s
      retries: 10

volumes:
  dev-db:
