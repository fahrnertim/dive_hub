packages:
  - apps/*
  - packages/*

# Supply-chain defaults stay on (minimumReleaseAge 1 day, strict build approval).
# Packages allowed to run install scripts are listed here after review.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - lucide-react@1.51.0

# dependency-cruiser parses TypeScript only when it can load the compiler, which it doesn't declare. TypeScript 7 has
# no compiler API, so the lint tools get the root's TypeScript 6 (research note 2026-10-22-agent-guardrails).
packageExtensions:
  dependency-cruiser:
    peerDependencies:
      typescript: '>=5 <7'
